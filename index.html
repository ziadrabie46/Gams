<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الهروب من الباك رومز 3D - Multiplayer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;font-family:Arial,sans-serif;color:#fff}canvas{display:block}#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#29200f,#080808 70%)}.card{width:min(440px,92vw);padding:28px;border:1px solid #c99b35;border-radius:22px;background:#111d;backdrop-filter:blur(12px);box-shadow:0 20px 70px #000}.card h1{margin:0 0 8px;color:#f2c45d;text-align:center}.card p{text-align:center;color:#bbb}.input,.select{width:100%;padding:14px;margin:7px 0;border:1px solid #555;border-radius:12px;background:#1d1d1d;color:white;font-size:16px}.btn{width:100%;padding:14px;margin-top:8px;border:0;border-radius:12px;background:#d7a93e;color:#111;font-weight:bold;font-size:16px}.btn.alt{background:#292929;color:#fff}.row{display:flex;gap:8px}.row .btn{flex:1}.hint{text-align:center;color:#888;font-size:12px;margin-top:10px}#hud{position:fixed;z-index:5;top:12px;right:12px;left:12px;display:none;pointer-events:none}.pill{display:inline-block;padding:9px 13px;margin:3px;border-radius:12px;background:#000b;border:1px solid #555;font-size:13px}.danger{width:150px;height:10px;display:inline-block;background:#333;border-radius:20px;overflow:hidden;vertical-align:middle}.danger i{display:block;height:100%;width:0;background:#e33}#notice{position:fixed;z-index:8;top:90px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:12px;background:#000d;display:none}#question{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;background:#000b}.qcard{width:min(520px,92vw);padding:24px;border:1px solid #d7a93e;border-radius:20px;background:#141414}.qcard h2{margin-top:0;color:#f2c45d}.option{width:100%;padding:13px;margin:6px 0;border:1px solid #555;border-radius:11px;background:#242424;color:#fff;text-align:right}.option:hover{background:#3a3020}#touch{position:fixed;z-index:7;display:none;inset:auto 0 18px 0;height:150px;pointer-events:none}.joy{position:absolute;left:25px;bottom:10px;width:125px;height:125px;border:2px solid #ffffff55;border-radius:50%;background:#0005;pointer-events:auto}.stick{position:absolute;left:37px;top:37px;width:48px;height:48px;border-radius:50%;background:#d7a93e99}.act{position:absolute;right:25px;bottom:28px;width:85px;height:85px;border-radius:50%;border:2px solid #fff8;background:#d7a93e;color:#111;font-weight:bold;pointer-events:auto}#end{position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;background:#000d}.endcard{padding:35px;text-align:center;border:1px solid #d7a93e;border-radius:22px;background:#151515}.endcard h1{color:#f2c45d}
</style>
</head>
<body>
<div id="menu"><div class="card"><h1>الهروب من الباك رومز 3D</h1><p>Multiplayer Edition</p><input id="name" class="input" maxlength="12" placeholder="اسم اللاعب"><select id="category" class="select"><option value="africa">أسئلة أفريقيا</option><option value="math">رياضيات</option><option value="general">معلومات عامة</option></select><input id="room" class="input" maxlength="6" placeholder="كود الغرفة للدخول (اختياري)"><div class="row"><button id="create" class="btn">إنشاء غرفة</button><button id="join" class="btn alt">دخول</button></div><div class="hint">شخص واحد ينشئ الغرفة والباقي يدخلون بنفس الكود.</div></div></div>
<div id="hud"><span class="pill" id="tasks">المهام: 0 / 25</span><span class="pill" id="players">اللاعبون: 1</span><span class="pill" id="roomHud">الغرفة: -</span><span class="pill">الخطر <span class="danger"><i id="danger"></i></span></span></div>
<div id="notice"></div><div id="question"><div class="qcard"><h2 id="qtitle">المحطة</h2><div id="qtext"></div><div id="opts"></div><button class="btn alt" onclick="closeQuestion()">إغلاق</button></div></div>
<div id="touch"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><button class="act" id="act">تفاعل</button></div>
<div id="end"><div class="endcard"><h1 id="endTitle">انتهت اللعبة</h1><p id="endText"></p><button class="btn" onclick="location.reload()">العودة للقائمة</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const socket=io();let scene,camera,renderer,player,monster;let remotes={};let terminals=[];let solved=new Set();let roomCode='',myId='';let questions=[],active=-1,gameRunning=false;let phase=1;let danger=0;let keys={};let joy={x:0,y:0};let lastSend=0,lastTime=performance.now();
const banks={africa:[['ما عاصمة مصر؟',['القاهرة','الرباط','نيروبي','أبوجا'],0],['ما عاصمة كينيا؟',['نيروبي','لاغوس','طرابلس','الخرطوم'],0],['ما عاصمة المغرب؟',['الجزائر','الرباط','تونس','كمبالا'],1],['ما أكبر دولة أفريقية مساحة؟',['مصر','نيجيريا','الجزائر','كينيا'],2],['ما النهر الذي يمر بمصر؟',['النيجر','النيل','الكونغو','زامبيزي'],1],['ما عاصمة نيجيريا؟',['أبوجا','لوساكا','داكار','أكرا'],0],['ما عاصمة غانا؟',['أكرا','هراري','مقديشو','باماكو'],0],['ما عاصمة تونس؟',['طرابلس','تونس','الرباط','الخرطوم'],1],['ما عاصمة السودان؟',['الخرطوم','القاهرة','أديس أبابا','جيبوتي'],0],['ما عاصمة إثيوبيا؟',['أديس أبابا','نيروبي','أسمرة','كيب تاون'],0]],math:[['5 + 7 = ؟',['10','11','12','13'],2],['9 × 6 = ؟',['45','54','63','36'],1],['100 ÷ 4 = ؟',['20','25','30','40'],1],['15 - 8 = ؟',['5','6','7','8'],2],['12 × 3 = ؟',['24','36','42','30'],1]],general:[['كم عدد أيام الأسبوع؟',['5','6','7','8'],2],['ما الكوكب الأقرب للشمس؟',['الأرض','المريخ','عطارد','الزهرة'],2],['ما لون الموز غالباً؟',['أحمر','أصفر','أزرق','أسود'],1],['كم عدد القارات؟',['5','6','7','8'],2],['ما الحيوان المعروف بملك الغابة؟',['النمر','الأسد','الفيل','الذئب'],1]]};
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x18150d);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe9a0,0x20180d,1.5));let floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x756a3f}));floor.rotation.x=-Math.PI/2;scene.add(floor);let grid=new THREE.GridHelper(180,36,0x4d452b,0x39321e);scene.add(grid);buildWalls();buildTerminals();buildMonster();player=makePlayer('أنت',0x21a7ff);scene.add(player);player.position.set(0,0,65);window.addEventListener('resize',resize);window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('pointerdown',()=>{});initTouch();animate()}
function makePlayer(name,color){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CylinderGeometry(.7,.8,1.7,10),new THREE.MeshStandardMaterial({color}));body.position.y=.85;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),new THREE.MeshStandardMaterial({color:0xf1c27d}));head.position.y=2;g.add(head);let c=document.createElement('canvas');c.width=256;c.height=64;let x=c.getContext('2d');x.fillStyle='#fff';x.font='bold 28px Arial';x.textAlign='center';x.fillText(name,128,40);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.position.y=3;s.scale.set(3,0.75,1);g.add(s);return g}
function buildWalls(){const m=new THREE.MeshStandardMaterial({color:0x4d452a});[[0,-88,180,2],[0,88,180,2],[-88,0,2,180],[88,0,2,180],[0,0,2,110],[-45,30,60,2],[45,-30,60,2],[-45,-30,2,60],[45,30,2,60]].forEach(a=>{let w=new THREE.Mesh(new THREE.BoxGeometry(a[2],5,a[3]),m);w.position.set(a[0],2.5,a[1]);scene.add(w)})}
function buildTerminals(){for(let i=0;i<25;i++){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(2,2.5,1),new THREE.MeshStandardMaterial({color:0x222222}));b.position.y=1.25;g.add(b);let s=new THREE.Mesh(new THREE.BoxGeometry(1.5,.9,.08),new THREE.MeshStandardMaterial({color:0x00d2d3,emissive:0x003333}));s.position.set(0,1.6,.54);g.add(s);let a=i<13?((i*47)%150-75):((i*83)%150-75),z=((i*61)%150-75);g.position.set(a,0,z);scene.add(g);terminals.push({g,screen:s,solved:false})}}
function buildMonster(){monster=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(4,6,3),new THREE.MeshStandardMaterial({color:0x080808}));b.position.y=3;monster.add(b);for(let x of [-1.1,1.1]){let e=new THREE.Mesh(new THREE.SphereGeometry(.3,10,10),new THREE.MeshBasicMaterial({color:0xff2222}));e.position.set(x,4,1.6);monster.add(e)}monster.position.set(0,0,-70);scene.add(monster)}
function showNotice(t){let n=document.getElementById('notice');n.textContent=t;n.style.display='block';clearTimeout(showNotice.t);showNotice.t=setTimeout(()=>n.style.display='none',2200)}
function start(data,creating){let name=(document.getElementById('name').value||'لاعب').trim();if(creating){socket.emit('create_room',{name,color:0x21a7ff,category:document.getElementById('category').value})}else socket.emit('join_room',{code:document.getElementById('room').value.trim(),name,color:0x21a7ff})}
socket.on('room_joined',data=>{roomCode=data.code;myId=data.selfId;document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='block';document.getElementById('touch').style.display='block';document.getElementById('roomHud').textContent='الغرفة: '+roomCode;questions=banks[document.getElementById('category').value]||banks.africa;setup();data.state.players.forEach(p=>{if(p.id!==myId)addRemote(p)});data.state.solved.forEach(i=>applySolved(i,false));phase=data.state.phase;gameRunning=true;showNotice('تم الدخول للغرفة '+roomCode);});
socket.on('room_error',m=>alert(m));socket.on('player_joined',p=>{addRemote(p);updatePlayers()});socket.on('player_left',id=>{if(remotes[id]){scene.remove(remotes[id]);delete remotes[id]}updatePlayers()});socket.on('player_move',d=>{if(remotes[d.id]){remotes[d.id].target.set(d.x,d.y,d.z);remotes[d.id].rotation.y=d.rotation}});socket.on('task_solved',d=>{d.solved.forEach(i=>applySolved(i,false));phase=d.phase;if(phase===2)showNotice('بدأت المرحلة الثانية! الوحش أصبح أخطر.');if(d.solved.length>=25)endGame(true)});
function addRemote(p){let g=makePlayer(p.name,p.color);g.position.set(p.x,p.y,p.z);g.target=new THREE.Vector3(p.x,p.y,p.z);remotes[p.id]=g;scene.add(g);updatePlayers()};function updatePlayers(){document.getElementById('players').textContent='اللاعبون: '+(Object.keys(remotes).length+1)}
function applySolved(i,own){let t=terminals[i];if(!t||t.solved)return;t.solved=true;t.screen.material.color.setHex(0x2ed573);solved.add(i);document.getElementById('tasks').textContent='المهام: '+solved.size+' / 25';if(own)socket.emit('solve_task',i);if(solved.size>=25)endGame(true)}
function nearest(){let best=-1,bd=3.8;terminals.forEach((t,i)=>{if(t.solved)return;let d=player.position.distanceTo(t.g.position);if(d<bd){bd=d;best=i}});return best}
function interact(){if(!gameRunning)return;let i=nearest();if(i<0){showNotice('اقترب من محطة الأسئلة');return}if(solved.has(i))return;active=i;let q=questions[i%questions.length];document.getElementById('qtitle').textContent='المحطة '+(i+1);document.getElementById('qtext').textContent=q[0];let o=document.getElementById('opts');o.innerHTML='';q[1].forEach((v,k)=>{let b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>answer(k===q[2]);o.appendChild(b)});document.getElementById('question').style.display='flex'}
function closeQuestion(){document.getElementById('question').style.display='none';active=-1}function answer(ok){if(active<0)return;if(ok){applySolved(active,true);showNotice('إجابة صحيحة');closeQuestion()}else{danger=Math.min(100,danger+25);showNotice('خطأ! الوحش اقترب.');closeQuestion();monster.position.x+=(Math.random()-.5)*8;monster.position.z+=8}}
function move(){let dx=0,dz=0;if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;dx+=joy.x;dz+=joy.y;let l=Math.hypot(dx,dz);if(l){dx/=l;dz/=l;let speed=.18;player.position.x+=dx*speed;player.position.z+=dz*speed;player.rotation.y=Math.atan2(dx,dz)}}
function monsterAI(){if(!monster)return;let dx=player.position.x-monster.position.x,dz=player.position.z-monster.position.z;let d=Math.hypot(dx,dz);let speed=phase===2?.12:.07;if(d>1){monster.position.x+=dx/d*speed;monster.position.z+=dz/d*speed}danger=Math.min(100,Math.max(0,100-d*2));document.getElementById('danger').style.width=danger+'%';if(d<3)endGame(false)}
function animate(){requestAnimationFrame(animate);if(!gameRunning)return;move();monsterAI();let now=performance.now();if(now-lastSend>50){lastSend=now;socket.emit('player_move',{x:player.position.x,y:player.position.y,z:player.position.z,rotation:player.rotation.y})}Object.values(remotes).forEach(g=>g.position.lerp(g.target,.2));camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+7,player.position.z+10),.12);camera.lookAt(player.position.x,player.position.y+1,player.position.z);renderer.render(scene,camera)}
function endGame(win){if(!gameRunning)return;gameRunning=false;document.getElementById('end').style.display='flex';document.getElementById('endTitle').textContent=win?'نجحتم في الهروب!':'أمسك بك الوحش!';document.getElementById('endText').textContent=win?'تم حل جميع المهام.':'اقترب الوحش منك كثيراً.'}
function resize(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function initTouch(){let j=document.getElementById('joy'),s=document.getElementById('stick');function set(e){let r=j.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,max=45,l=Math.hypot(x,y);if(l>max){x=x/l*max;y=y/l*max}s.style.transform=`translate(${x}px,${y}px)`;joy.x=x/max;joy.y=y/max}j.addEventListener('pointermove',set);j.addEventListener('pointerdown',e=>{j.setPointerCapture(e.pointerId);set(e)});j.addEventListener('pointerup',()=>{joy.x=joy.y=0;s.style.transform='translate(0,0)'});document.getElementById('act').onclick=interact}
document.getElementById('create').onclick=()=>start(null,true);document.getElementById('join').onclick=()=>{if(!document.getElementById('room').value.trim())return alert('اكتب كود الغرفة');start(null,false)};
</script></body></html>
