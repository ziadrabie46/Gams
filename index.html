<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>الهروب من الباك رومز 3D - مالتي بلاير</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; touch-action: none; }
        
        #main-menu {
            position: absolute; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.95); display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; color: #fff; text-align: center; padding: 20px;
        }
        #main-menu h1 { font-size: 2.5rem; margin-bottom: 10px; color: #f1c40f; text-shadow: 0 0 15px #f1c40f; }
        #main-menu p { margin-bottom: 15px; color: #aaa; font-size: 0.95rem; }
        .input-group { margin: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .input-group label { font-size: 1rem; color: #f1c40f; }
        .custom-input {
            padding: 10px 18px; font-size: 1rem; border-radius: 8px; border: 2px solid #f1c40f;
            background: #1e272e; color: #fff; text-align: center; outline: none; width: 240px;
        }
        #main-menu select {
            padding: 10px 18px; font-size: 1rem; border-radius: 8px; border: none; margin: 8px;
            background: #2f3542; color: #fff; cursor: pointer; outline: none; width: 240px; text-align: center;
        }
        .btn-container { display: flex; gap: 12px; margin-top: 15px; }
        .btn-host { background: #2ed573; color: #000; font-weight: bold; padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; }
        .btn-join { background: #eccc68; color: #000; font-weight: bold; padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; }

        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        
        #hud-header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px; width: 90%; max-width: 500px;
        }
        #hud-top-row { display: flex; justify-content: space-between; width: 100%; gap: 10px; }
        #tasks-tracker, #timer-display {
            background: rgba(0,0,0,0.85); border: 2px solid #f1c40f; color: #f1c40f;
            padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; flex: 1; text-align: center;
        }
        #timer-display { border-color: #ff4757; color: #ff4757; }
        #danger-container {
            width: 100%; background: rgba(0,0,0,0.8);
            border: 2px solid #ff4757; border-radius: 20px; padding: 6px; text-align: center;
        }
        #danger-label { color: #fff; font-weight: bold; margin-bottom: 4px; font-size: 0.85rem; }
        #danger-bar-bg { width: 100%; height: 14px; background: #222; border-radius: 10px; overflow: hidden; }
        #danger-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ffa500, #ff4757); transition: width 0.3s; }

        #notification-banner {
            position: absolute; top: 140px; left: 50%; transform: translateX(-50%);
            background: rgba(46, 213, 115, 0.95); color: #000; padding: 12px 25px;
            border-radius: 10px; font-size: 1.1rem; font-weight: bold; display: none;
            box-shadow: 0 0 25px rgba(46, 213, 115, 0.8); z-index: 6; text-align: center; max-width: 80%;
        }

        #server-status {
            position: absolute; bottom: 15px; right: 15px;
            background: rgba(0,0,0,0.8); color: #f1c40f; padding: 8px 14px;
            border-radius: 8px; font-size: 0.9rem; font-weight: bold; z-index: 6; border: 1px solid #f1c40f;
        }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            touch-action: none; pointer-events: auto;
        }
        #joystick-knob {
            width: 50px; height: 50px; background: rgba(241, 196, 15, 0.9);
            border-radius: 50%; position: absolute; top: 35px; left: 35px; pointer-events: none;
        }
        #action-btn {
            position: absolute; bottom: 40px; right: 40px;
            width: 85px; height: 85px; background: rgba(255, 71, 87, 0.9);
            border: 2px solid #fff; border-radius: 50%; color: #fff;
            font-weight: bold; font-size: 1.2rem; display: none;
            justify-content: center; align-items: center; cursor: pointer; pointer-events: auto;
        }
        #touch-camera-zone {
            position: absolute; top: 0; right: 0; width: 65%; height: 100%;
            pointer-events: auto; touch-action: none;
        }

        #question-card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 550px; background: rgba(15, 15, 15, 0.98);
            border: 2px solid #f1c40f; border-radius: 15px; padding: 25px;
            text-align: center; color: #fff; pointer-events: auto; display: none;
        }
        #question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.5; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-btn {
            background: #2f3542; border: 1px solid #57606f; color: #fff;
            padding: 12px; font-size: 0.95rem; border-radius: 8px; cursor: pointer;
        }
        .option-btn:hover { background: #f1c40f; color: #000; font-weight: bold; }

        #game-over {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; color: #fff; text-align: center; padding: 20px;
        }
        #game-over h2 { font-size: 3.2rem; margin-bottom: 10px; }
        #blame-msg { font-size: 1.4rem; color: #ff4757; font-weight: bold; margin-bottom: 15px; }
        #game-over button { padding: 12px 30px; font-size: 1.2rem; background: #f1c40f; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- مكتبة PeerJS للمالتي بلاير -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="main-menu">
        <h1>الهروب من الباك رومز</h1>
        <p>العب مع أصدقائك في نفس الغرفة!</p>
        
        <div class="input-group">
            <label for="player-name-input">اسم اللاعب:</label>
            <input type="text" id="player-name-input" class="custom-input" placeholder="ادخل اسمك..." value="زياد">
        </div>

        <div class="input-group">
            <label for="room-code-input">رمز الغرفة (رقم سري):</label>
            <input type="text" id="room-code-input" class="custom-input" placeholder="مثال: 1234" value="1234">
        </div>

        <div class="input-group">
            <label for="category-select">المادة الدراسية:</label>
            <select id="category-select">
                <option value="africa_room">دراسات: قارة إفريقيا</option>
                <option value="math_room">الرياضيات</option>
                <option value="general_room">معلومات عامة</option>
            </select>
        </div>

        <div class="btn-container">
            <button class="btn-host" onclick="startGame('host')">إنشاء غرفة (Host)</button>
            <button class="btn-join" onclick="startGame('join')">انضمام لغرفة (Join)</button>
        </div>
    </div>

    <div id="ui-container">
        <div id="hud-header">
            <div id="hud-top-row">
                <div id="tasks-tracker">المهام: 0 / 25</div>
                <div id="timer-display">الوقت: 01:30</div>
            </div>
            <div id="danger-container">
                <div id="danger-label">الوحش يقترب!</div>
                <div id="danger-bar-bg"><div id="danger-bar"></div></div>
            </div>
        </div>

        <div id="notification-banner">تم إنهاء المهمة!</div>
        <div id="server-status">غير متصل</div>
        
        <div id="touch-camera-zone"></div>
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="action-btn" onclick="interactWithTerminal()">حل!</div>

        <div id="question-card">
            <div id="question-text">السؤال...</div>
            <div class="options-grid" id="options-container"></div>
        </div>
    </div>

    <div id="game-over">
        <h2 id="game-over-title">Game Over</h2>
        <div id="blame-msg"></div>
        <p id="game-over-msg" style="margin-bottom: 20px; font-size: 1.2rem;"></p>
        <button onclick="location.reload()">العودة للقائمة</button>
    </div>

    <script>
        // الأصوات
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // الأسئلة
        const questionBank = {
            africa_room: [
                { q: "تعد قارة إفريقيا ثاني أكبر قارات العالم مساحة بعد قارة:", options: ["أوروبا", "أمريكا الشمالية", "آسيا", "أستراليا"], correct: 2 },
                { q: "تبلغ مساحة قارة إفريقيا حوالي كم مليون كم²؟", options: ["44.2", "30.4", "10.5", "17.8"], correct: 1 },
                { q: "تمثل مساحة إفريقيا حوالي 20% (أي كم) من مساحة يابس الكرة الأرضية؟", options: ["الربع", "الخمس", "النصف", "الثلث"], correct: 1 },
                { q: "يمر بوسط قارة إفريقيا تقريباً دائرة عرض رئيسية هي:", options: ["مدار السرطان", "دائرة الاستواء", "مدار الجدي", "الدائرة القطبية"], correct: 1 },
                { q: "يحد قارة إفريقيا من جهة الشمال البحر المتوسط الذي يفصلها عن قارة:", options: ["آسيا", "أوروبا", "أمريكا الشمالية", "أستراليا"], correct: 1 },
                { q: "يحد قارة إفريقيا من جهة الغرب المحيط:", options: ["الهادي", "الهندي", "الأطلنطي", "القطبي الشمالي"], correct: 2 },
                { q: "تتصل قارة إفريقيا بقارة آسيا عن طريق شبه جزيرة:", options: ["العرب", "الصومال", "سيناء", "البلقان"], correct: 2 },
                { q: "نشأت على أرض إفريقيا حضارة قرطاج في دولة:", options: ["مصر", "تونس", "السودان", "المغرب"], correct: 1 },
                { q: "تضم قارة إفريقيا كم دولة مختلفة المساحة؟", options: ["45 دولة", "54 دولة", "60 دولة", "30 دولة"], correct: 1 },
                { q: "تعد أكبر دول القارة الإفريقية من حيث المساحة دولة:", options: ["مصر", "السودان", "الجزائر", "نيجيريا"], correct: 2 }
            ],
            math_room: [
                { q: "7 × 8 = ؟", options: ["54", "56", "64", "48"], correct: 1 },
                { q: "12 + 15 = ؟", options: ["25", "27", "29", "30"], correct: 1 }
            ],
            general_room: [
                { q: "عاصمة مصر هي؟", options: ["الإسكندرية", "القاهرة", "الجيزة", "الأقصر"], correct: 1 }
            ]
        };

        // متغيرات اللعبة الأساسية
        let currentQuestions = [];
        let activeTerminal = null;
        let isGameOver = false;
        let inQuestionMenu = false;
        let playerName = "زياد";
        let solvedCount = 0;
        let timeRemaining = 90; 
        let timerInterval = null;
        let myPlayerColor = 0xf1c40f; 

        // Three.js Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a00);
        scene.fog = new THREE.FogExp2(0x0a0a00, 0.025);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // بناء المتاهة
        const MAP_SIZE = 120;
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x8B8000, roughness: 1 });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x333311, roughness: 1 });
        
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE), floorMat);
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        const wallBoundingBoxes = [];
        function createWall(w, h, d, x, y, z) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            wall.position.set(x, y, z); scene.add(wall);
            wallBoundingBoxes.push(new THREE.Box3().setFromObject(wall));
        }
        
        // حدود الخريطة
        const hSize = MAP_SIZE / 2;
        createWall(MAP_SIZE, 10, 2, 0, 5, -hSize); createWall(MAP_SIZE, 10, 2, 0, 5, hSize);
        createWall(2, 10, MAP_SIZE, -hSize, 5, 0); createWall(2, 10, MAP_SIZE, hSize, 5, 0);

        // حوائط داخلية عشوائية
        for(let i=0; i<15; i++){
            createWall(
                Math.random() > 0.5 ? 30 : 2, 10, Math.random() > 0.5 ? 2 : 30,
                (Math.random() - 0.5) * 80, 5, (Math.random() - 0.5) * 80
            );
        }

        // إنشاء اللاعب
        const playerGroup = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.8), new THREE.MeshStandardMaterial({ color: myPlayerColor }));
        pBody.position.y = 0.9; playerGroup.add(pBody);
        
        // إسم اللاعب فوق رأسه
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        canvas.width = 256; canvas.height = 64;
        const nameTexture = new THREE.CanvasTexture(canvas);
        const nameSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: nameTexture }));
        nameSprite.position.set(0, 2.5, 0); nameSprite.scale.set(3, 0.75, 1);
        playerGroup.add(nameSprite);
        
        function updateNameTag(name) {
            ctx.clearRect(0,0,256,64); ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,256,64);
            ctx.font='bold 28px Arial'; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(name, 128, 42);
            nameTexture.needsUpdate = true;
        }
        
        scene.add(playerGroup);

        // المهام (Terminals)
        const terminals = [];
        for (let i = 0; i < 25; i++) {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.5), new THREE.MeshStandardMaterial({ color: 0x222 }));
            const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ color: 0x00d2d3 }));
            screen.position.set(0, 0.2, 0.26);
            group.add(base); group.add(screen);
            
            let px = (Math.random() - 0.5) * (MAP_SIZE - 20);
            let pz = (Math.random() - 0.5) * (MAP_SIZE - 20);
            group.position.set(px, 1.5, pz);
            scene.add(group);
            terminals.push({ group, screen, solved: false, index: i });
        }

        // الوحش
        const monsterGroup = new THREE.Group();
        const mBody = new THREE.Mesh(new THREE.BoxGeometry(3, 5, 3), new THREE.MeshStandardMaterial({ color: 0x111 }));
        mBody.position.y = 2.5; monsterGroup.add(mBody);
        const mEye = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
        mEye.position.set(0, 3.5, 1.5); monsterGroup.add(mEye);
        scene.add(monsterGroup);

        // ==================== نظام المالتي بلاير (PeerJS) المطور ====================
        let peer = null;
        let activeConnections = [];
        let remotePlayers = {};
        
        function initMultiplayer(mode, roomCode) {
            const hostId = "ziadgame_" + roomCode; // ID مميز للغرفة

            if (mode === 'host') {
                // المستضيف ينشئ غرفة بالـ ID المحدد
                peer = new Peer(hostId);
                
                peer.on('open', (id) => {
                    document.getElementById('server-status').innerText = "الغرفة جاهزة: " + roomCode;
                    document.getElementById('server-status').style.color = "#2ed573";
                    showNotification("أنت المستضيف! الكود: " + roomCode);
                });

                peer.on('connection', (conn) => {
                    handleNewConnection(conn);
                    showNotification("انضم لاعب جديد للغرفة!");
                });

                peer.on('error', (err) => {
                    alert("عذراً، هذا الرمز مستخدم بالفعل. جرب رمز آخر أو اضغط انضمام.");
                    location.reload();
                });

            } else {
                // المنضم ينشئ ID عشوائي ليتجنب المشاكل
                peer = new Peer();
                
                peer.on('open', (id) => {
                    document.getElementById('server-status').innerText = "جاري الاتصال...";
                    const conn = peer.connect(hostId); // الاتصال بالمستضيف
                    
                    conn.on('open', () => {
                        handleNewConnection(conn);
                        document.getElementById('server-status').innerText = "متصل بالغرفة: " + roomCode;
                        document.getElementById('server-status').style.color = "#2ed573";
                        showNotification("تم الانضمام للغرفة بنجاح!");
                        
                        // إرسال بياناتي فوراً للمستضيف
                        conn.send({ type: 'init', name: playerName, color: myPlayerColor });
                    });
                    
                    conn.on('error', () => {
                        alert("تعذر الاتصال بالغرفة! تأكد أن المستضيف أنشأها بنفس الرمز.");
                    });
                });
            }

            // إرسال موقعي لكل المتصلين بمعدل 20 مرة في الثانية
            setInterval(() => {
                if (activeConnections.length > 0 && !isGameOver) {
                    const myData = { 
                        type: 'move', 
                        x: playerGroup.position.x, 
                        y: playerGroup.position.y, 
                        z: playerGroup.position.z, 
                        r: playerGroup.rotation.y 
                    };
                    activeConnections.forEach(c => {
                        if (c.open) c.send(myData);
                    });
                }
            }, 50);
        }

        function handleNewConnection(conn) {
            activeConnections.push(conn);
            
            // لما اللاعب التاني يدخل، ابعتله اسمي ليتعرف عليا
            conn.send({ type: 'init', name: playerName, color: myPlayerColor });

            conn.on('data', (data) => {
                if (data.type === 'init') {
                    // إنشاء مجسم للاعب الثاني
                    if (!remotePlayers[conn.peer]) {
                        const rGroup = new THREE.Group();
                        const rBody = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.8), new THREE.MeshStandardMaterial({ color: 0x3498db }));
                        rBody.position.y = 0.9; rGroup.add(rBody);
                        
                        // اسم اللاعب الثاني
                        const rCanvas = document.createElement('canvas'); const rCtx = rCanvas.getContext('2d');
                        rCanvas.width = 256; rCanvas.height = 64;
                        rCtx.fillStyle='rgba(0,0,0,0.5)'; rCtx.fillRect(0,0,256,64);
                        rCtx.font='bold 28px Arial'; rCtx.fillStyle='#3498db'; rCtx.textAlign='center'; rCtx.fillText(data.name, 128, 42);
                        const rSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(rCanvas) }));
                        rSprite.position.set(0, 2.5, 0); rSprite.scale.set(3, 0.75, 1);
                        rGroup.add(rSprite);
                        
                        scene.add(rGroup);
                        remotePlayers[conn.peer] = rGroup;
                    }
                } else if (data.type === 'move' && remotePlayers[conn.peer]) {
                    // تحديث مكان اللاعب الثاني
                    remotePlayers[conn.peer].position.set(data.x, data.y, data.z);
                    remotePlayers[conn.peer].rotation.y = data.r;
                } else if (data.type === 'task') {
                    // تحديث المهام اللي اللاعب الثاني حلها
                    const t = terminals[data.index];
                    if (t && !t.solved) {
                        t.solved = true;
                        t.screen.material.color.setHex(0x2ed573);
                        solvedCount++;
                        document.getElementById('tasks-tracker').innerText = `المهام: ${solvedCount} / 25`;
                    }
                } else if (data.type === 'dead') {
                    endGame(false, data.killerName, "الوحش أمسك بصديقك، لقد خسر الفريق!");
                }
            });

            conn.on('close', () => {
                if (remotePlayers[conn.peer]) {
                    scene.remove(remotePlayers[conn.peer]);
                    delete remotePlayers[conn.peer];
                }
            });
        }

        // ==================== أزرار الحركة والتحكم ====================
        let joystickActive = false, joystickInput = { x: 0, y: 0 }, joyCenter = { x: 0, y: 0 }, joyId = null;
        const joyZone = document.getElementById('joystick-zone'), joyKnob = document.getElementById('joystick-knob');
        
        joyZone.addEventListener('touchstart', e => {
            joyId = e.changedTouches[0].identifier; joystickActive = true;
            const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            updateJoy(e.changedTouches[0]);
        });
        window.addEventListener('touchmove', e => {
            if(!joystickActive) return;
            for(let t of e.changedTouches) if(t.identifier === joyId) updateJoy(t);
        });
        window.addEventListener('touchend', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === joyId) {
                    joystickActive = false; joystickInput = {x:0, y:0};
                    joyKnob.style.left = '35px'; joyKnob.style.top = '35px';
                }
            }
        });
        function updateJoy(touch) {
            let dx = touch.clientX - joyCenter.x, dy = touch.clientY - joyCenter.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > 40) { dx = (dx/dist)*40; dy = (dy/dist)*40; }
            joyKnob.style.left = (35 + dx) + 'px'; joyKnob.style.top = (35 + dy) + 'px';
            joystickInput = { x: dx/40, y: dy/40 };
        }

        let camYaw = 0, camPitch = 0.3;
        let isCamDrag = false, lastCamPos = {x:0, y:0}, camId = null;
        document.getElementById('touch-camera-zone').addEventListener('touchstart', e => {
            if(inQuestionMenu) return;
            camId = e.changedTouches[0].identifier; lastCamPos = {x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY};
        });
        window.addEventListener('touchmove', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === camId) {
                    camYaw -= (t.clientX - lastCamPos.x) * 0.006;
                    camPitch = Math.max(0.1, Math.min(1.2, camPitch + (t.clientY - lastCamPos.y) * 0.005));
                    lastCamPos = {x: t.clientX, y: t.clientY};
                }
            }
        });
        window.addEventListener('touchend', e => {
            for(let t of e.changedTouches) if(t.identifier === camId) camId = null;
        });

        // ==================== منطق اللعبة ====================
        function checkCollision(pos) {
            const pBox = new THREE.Box3(
                new THREE.Vector3(pos.x - 0.8, 0, pos.z - 0.8),
                new THREE.Vector3(pos.x + 0.8, 2, pos.z + 0.8)
            );
            for(let b of wallBoundingBoxes) if(pBox.intersectsBox(b)) return true;
            return false;
        }

        function startGame(mode) {
            playerName = document.getElementById('player-name-input').value.trim() || "زياد";
            updateNameTag(playerName);
            
            const roomCode = document.getElementById('room-code-input').value.trim() || "1234";
            const category = document.getElementById('category-select').value;
            currentQuestions = [...questionBank[category]] || [...questionBank['general_room']];

            document.getElementById('main-menu').style.display = 'none';
            playerGroup.position.set(0, 0, 40);
            monsterGroup.position.set(0, 0, -40);
            
            initMultiplayer(mode, roomCode);

            timerInterval = setInterval(() => {
                if(isGameOver || inQuestionMenu) return;
                timeRemaining--;
                let m = Math.floor(timeRemaining / 60), s = timeRemaining % 60;
                document.getElementById('timer-display').innerText = `الوقت: 0${m}:${s<10?'0':''}${s}`;
                if(timeRemaining <= 0) endGame(false, playerName, "انتهى الوقت!");
            }, 1000);
        }

        function interactWithTerminal() {
            if(!activeTerminal || inQuestionMenu) return;
            inQuestionMenu = true; document.getElementById('action-btn').style.display = 'none';
            
            const q = currentQuestions[activeTerminal.index % currentQuestions.length];
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container'); container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const b = document.createElement('button'); b.className = 'option-btn'; b.innerText = opt;
                b.onclick = () => {
                    document.getElementById('question-card').style.display = 'none';
                    inQuestionMenu = false;
                    if(idx === q.correct) {
                        playSound('success'); activeTerminal.solved = true;
                        activeTerminal.screen.material.color.setHex(0x2ed573);
                        solvedCount++; document.getElementById('tasks-tracker').innerText = `المهام: ${solvedCount} / 25`;
                        showNotification("مهمة ناجحة!");
                        
                        // إبلاغ الأصدقاء
                        activeConnections.forEach(c => { if(c.open) c.send({ type: 'task', index: activeTerminal.index }); });
                        
                        if(solvedCount >= 25) endGame(true, null, "لقد هزمتم الوحش وهربتم معاً!");
                    } else {
                        playSound('error'); showNotification("إجابة خاطئة! الوحش اقترب!");
                        monsterGroup.position.lerp(playerGroup.position, 0.2); // الوحش يقفز باتجاهك
                    }
                };
                container.appendChild(b);
            });
            document.getElementById('question-card').style.display = 'block';
        }

        function showNotification(msg) {
            const b = document.getElementById('notification-banner');
            b.innerText = msg; b.style.display = 'block';
            setTimeout(() => b.style.display = 'none', 3000);
        }

        function endGame(won, blameName, msg) {
            isGameOver = true;
            document.getElementById('game-over-title').innerText = won ? "نجاح!" : "خسارة!";
            document.getElementById('game-over-title').style.color = won ? "#2ed573" : "#ff4757";
            if(blameName) document.getElementById('blame-msg').innerText = `السبب: ${blameName}`;
            document.getElementById('game-over-msg').innerText = msg;
            document.getElementById('game-over').style.display = 'flex';
        }

        // ==================== حلقة التحديث (Animation Loop) ====================
        function animate() {
            requestAnimationFrame(animate);
            if(isGameOver) return renderer.render(scene, camera);

            // حركة اللاعب
            if(!inQuestionMenu && joystickActive) {
                const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw)).normalize();
                const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw)).normalize();
                const moveDir = new THREE.Vector3().addScaledVector(forward, -joystickInput.y).addScaledVector(right, joystickInput.x);
                
                const speed = 0.35;
                const nextX = playerGroup.position.clone().addScaledVector(new THREE.Vector3(moveDir.x,0,0), speed);
                if(!checkCollision(nextX)) playerGroup.position.x = nextX.x;
                
                const nextZ = playerGroup.position.clone().addScaledVector(new THREE.Vector3(0,0,moveDir.z), speed);
                if(!checkCollision(nextZ)) playerGroup.position.z = nextZ.z;
                
                if(moveDir.lengthSq() > 0.01) playerGroup.rotation.y = Math.atan2(moveDir.x, moveDir.z);
            }

            // حركة الكاميرا
            const camDist = 12;
            camera.position.set(
                playerGroup.position.x + camDist * Math.sin(camYaw) * Math.cos(camPitch),
                playerGroup.position.y + camDist * Math.sin(camPitch) + 1.5,
                playerGroup.position.z + camDist * Math.cos(camYaw) * Math.cos(camPitch)
            );
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            // التحقق من المهام
            activeTerminal = null; document.getElementById('action-btn').style.display = 'none';
            if(!inQuestionMenu) {
                for(let t of terminals) {
                    if(!t.solved && playerGroup.position.distanceTo(t.group.position) < 4) {
                        activeTerminal = t; document.getElementById('action-btn').style.display = 'flex'; break;
                    }
                }
            }

            // حركة الوحش
            monsterGroup.lookAt(playerGroup.position.x, 0, playerGroup.position.z);
            const mDir = new THREE.Vector3(0,0,1).applyQuaternion(monsterGroup.quaternion).normalize();
            const mNext = monsterGroup.position.clone().addScaledVector(mDir, 0.15);
            if(!checkCollision(mNext)) monsterGroup.position.copy(mNext);

            // حساب المسافة والخطر
            const dist = monsterGroup.position.distanceTo(playerGroup.position);
            document.getElementById('danger-bar').style.width = Math.max(0, Math.min(100, ((60 - dist)/60)*100)) + '%';
            
            if(dist < 3) {
                activeConnections.forEach(c => { if(c.open) c.send({ type: 'dead', killerName: playerName }); });
                endGame(false, playerName, "لقد أمسك بك الوحش!");
            }

            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
