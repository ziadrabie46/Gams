<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الباكرومز - النسخة الكلاسيكية الأصلية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #f5f5f5;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #app-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* شاشة القائمة الرئيسية الكلاسيكية */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #2b2512 0%, #080602 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.4s ease;
        }

        .menu-box {
            background: rgba(15, 13, 8, 0.92);
            border: 2px solid #d4af37;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.35);
            max-width: 420px;
            width: 100%;
        }

        .menu-box h1 {
            color: #f1c40f;
            margin-bottom: 25px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #d4af37;
            font-size: 13px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #443c22;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #f1c40f;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f1c40f 0%, #d4af37 100%);
            border: none;
            color: #111;
            font-weight: bold;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }

        /* الكانفاس الخاص باللعبة */
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #1a170e;
        }

        /* واجهة الـ HUD العلوي */
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .hud-card {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid #443c22;
            padding: 15px 20px;
            border-radius: 8px;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        .hud-card h3 {
            color: #f1c40f;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .hud-card p {
            font-size: 13px;
            color: #ccc;
        }

        /* واجهة الشادر والدردشة الداخلية */
        #chat-interface {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 200px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #443c22;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
            z-index: 10;
            display: none;
            backdrop-filter: blur(5px);
        }

        #chat-messages-box {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-line {
            word-break: break-all;
        }

        .chat-line span {
            color: #f1c40f;
            font-weight: bold;
        }

        #chat-form {
            display: flex;
            border-top: 1px solid #443c22;
        }

        #chat-input-box {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        #chat-submit-btn {
            background: #d4af37;
            border: none;
            padding: 0 12px;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
    </style>

    <!-- استدعاء مكتبة Three.js الأساسية للرسم ثلاثي الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="app-wrapper">
        <!-- شاشة القائمة الرئيسية -->
        <div id="main-menu">
            <div class="menu-box">
                <h1>Backrooms Classic</h1>
                
                <div class="input-group">
                    <label for="player-name-input">اسم اللاعب</label>
                    <input type="text" id="player-name-input" class="input-field" value="زياد بابا" placeholder="ادخل اسمك...">
                </div>

                <button class="action-btn" id="btn-start-game">بدء التجوال الفردي</button>
            </div>
        </div>

        <!-- ساحة اللعبة -->
        <canvas id="game-canvas"></canvas>

        <!-- لوحة معلومات الـ HUD -->
        <div id="hud-overlay">
            <div class="hud-card">
                <h3>معلومات المتاهة</h3>
                <p>اللاعب: <span id="hud-name-text" style="color: #f1c40f;">زياد بابا</span></p>
                <p>التحكم: (W, A, S, D) للحركة + الماوس للتوجيه</p>
            </div>
        </div>

        <!-- لوحة المحادثة الداخلية (للملاحظات والشات الفردي) -->
        <div id="chat-interface">
            <div id="chat-messages-box">
                <div class="chat-line"><span>النظام:</span> أهلاً بك في أعماق الباكرومز الكلاسيكية.</div>
            </div>
            <form id="chat-form">
                <input type="text" id="chat-input-box" placeholder="اكتب ملاحظة أو رسالة..." autocomplete="off">
                <button type="submit" id="chat-submit-btn">إرسال</button>
            </form>
        </div>
    </div>

    <script>
        /**
         * محرك لعبة الباكرومز الكلاسيكي الفردي
         * تصميم مباشر، خالي من أي تعقيدات شبكية، وسلس تماماً.
         */

        let scene, camera, renderer;
        let moveFwd = false, moveBwd = false, moveLft = false, moveRgt = false;
        let lastTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const HALF_PI = Math.PI / 2;

        document.addEventListener("DOMContentLoaded", () => {
            const startBtn = document.getElementById("btn-start-game");
            startBtn.addEventListener("click", () => {
                const playerName = document.getElementById("player-name-input").value.trim() || "لاعب";
                document.getElementById("hud-name-text").innerText = playerName;
                
                // إخفاء القائمة وبدء اللعبة مباشرة
                const menu = document.getElementById("main-menu");
                menu.style.opacity = "0";
                setTimeout(() => {
                    menu.style.display = "none";
                    document.getElementById("hud-overlay").style.display = "flex";
                    document.getElementById("chat-interface").style.display = "flex";
                    initGameEngine();
                }, 400);
            });

            // تفعيل نظام الشات الداخلي
            const chatForm = document.getElementById("chat-form");
            chatForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const inputBox = document.getElementById("chat-input-box");
                const text = inputBox.value.trim();
                if (text) {
                    const currentName = document.getElementById("hud-name-text").innerText;
                    appendChatLine(currentName, text);
                    inputBox.value = "";
                }
            });
        });

        function initGameEngine() {
            const canvas = document.getElementById("game-canvas");
            
            // إنشاء المشهد والكاميرا
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a170e);
            scene.fog = new THREE.FogExp2(0x1a170e, 0.03);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // الإضاءة الصفراء المميزة للباكرومز
            const ambientLight = new THREE.AmbientLight(0xfffaed, 0.9);
            scene.add(ambientLight);

            // الأرضية
            const floorGeo = new THREE.PlaneGeometry(250, 250);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xc4b454, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // السقف
            const ceilingGeo = new THREE.PlaneGeometry(250, 250);
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x8a7f45, roughness: 0.8 });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 10;
            scene.add(ceiling);

            // الجدران الموزعة داخل المتاهة
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xd9c362, roughness: 0.7 });
            for (let i = -90; i <= 90; i += 30) {
                if (i === 0) continue;
                const wallGeo = new THREE.BoxGeometry(20, 10, 2);
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(i, 5, i);
                scene.add(wall);
            }

            // التعامل مع حركة الماوس وقفل المؤشر
            canvas.addEventListener('click', () => {
                canvas.requestPointerLock();
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === canvas) {
                    const movementX = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
                    const movementY = e.movementY || e.mozMovementY || e.webkitMovementY || 0;

                    euler.setFromQuaternion(camera.quaternion);
                    euler.y -= movementX * 0.002;
                    euler.x -= movementY * 0.002;
                    euler.x = Math.max(-HALF_PI, Math.min(HALF_PI, euler.x));
                    camera.quaternion.setFromEuler(euler);
                }
            });

            // أزرار التحكم بالحركة
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveFwd = true; break;
                    case 'KeyS': moveBwd = true; break;
                    case 'KeyA': moveLft = true; break;
                    case 'KeyD': moveRgt = true; break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveFwd = false; break;
                    case 'KeyS': moveBwd = false; break;
                    case 'KeyA': moveLft = false; break;
                    case 'KeyD': moveRgt = false; break;
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // بدء حلقة التحديث الكلاسيكية
            animateLoop();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            const timeNow = performance.now();
            const delta = (timeNow - lastTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveFwd) - Number(moveBwd);
            direction.x = Number(moveRgt) - Number(moveLft);
            direction.normalize();

            if (moveFwd || moveBwd) velocity.z -= direction.z * 350.0 * delta;
            if (moveLft || moveRgt) velocity.x -= direction.x * 350.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(-velocity.z * delta);

            renderer.render(scene, camera);
            lastTime = timeNow;
        }

        function appendChatLine(name, text) {
            const chatBox = document.getElementById("chat-messages-box");
            const line = document.createElement("div");
            line.className = "chat-line";
            line.innerHTML = `<span>${escapeHTML(name)}:</span> ${escapeHTML(text)}`;
            chatBox.appendChild(line);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
