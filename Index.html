<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الباكرومز الكلاسيكية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a170e;
            font-family: Tahoma, sans-serif;
        }

        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #instructions {
            text-align: center;
            color: #f1c40f;
            cursor: pointer;
            border: 2px solid #f1c40f;
            padding: 20px 40px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
        }

        #instructions h1 {
            margin-top: 0;
            font-size: 28px;
        }

        #instructions p {
            color: #fff;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
    <!-- مكتبة ثري دي القديمة والمستقرة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            <h1>Backrooms Classic</h1>
            <p>انقر هنا للبدء والدخول إلى المتاهة</p>
            <p style="color: #f1c40f; font-size: 13px;">التحرك: (W, A, S, D) | التوجيه: بالماوس</p>
        </div>
    </div>

    <script>
        let camera, scene, renderer;
        let moveFwd = false, moveBwd = false, moveLft = false, moveRgt = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd4af37);
            scene.fog = new THREE.FogExp2(0xd4af37, 0.04);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 3;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // إضاءة المكان بلون الباكرومز الصفراوي الشهير
            const ambientLight = new THREE.AmbientLight(0xfffaed, 1.0);
            scene.add(ambientLight);

            // الأرضية
            const floorGeo = new THREE.PlaneGeometry(300, 300, 50, 50);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0xc4b454 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // السقف
            const ceilingGeo = new THREE.PlaneGeometry(300, 300);
            const ceilingMat = new THREE.MeshBasicMaterial({ color: 0x8a7f45 });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 8;
            scene.add(ceiling);

            // الجدران العشوائية لتشكيل المتاهة البسيطة
            const wallMat = new THREE.MeshBasicMaterial({ color: 0xedd570 });
            for (let i = -100; i <= 100; i += 25) {
                if (i === 0) continue;
                const wallGeo = new THREE.BoxGeometry(20, 8, 2);
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(i, 4, i);
                scene.add(wall);
            }

            // تفعيل قفل الماوس عند الضغط على الشاشة
            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', () => {
                renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === renderer.domElement) {
                    blocker.style.display = 'none';
                } else {
                    blocker.style.display = 'flex';
                }
            });

            // التحكم بالماوس (التفات الكاميرا)
            document.addEventListener('mousemove', (event) => {
                if (document.pointerLockElement === renderer.domElement) {
                    const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                    const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

                    camera.rotation.y -= movementX * 0.002;
                    camera.rotation.x -= movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                }
            });

            // التحكم بلوحة المفاتيح للحركة
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveFwd = true; break;
                    case 'KeyS': moveBwd = true; break;
                    case 'KeyA': moveLft = true; break;
                    case 'KeyD': moveRgt = true; break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveFwd = false; break;
                    case 'KeyS': moveBwd = false; break;
                    case 'KeyA': moveLft = false; break;
                    case 'KeyD': moveRgt = false; break;
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveFwd) - Number(moveBwd);
            direction.x = Number(moveRgt) - Number(moveLft);
            direction.normalize();

            if (moveFwd || moveBwd) velocity.z -= direction.z * 400.0 * delta;
            if (moveLft || moveRgt) velocity.x -= direction.x * 400.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(-velocity.z * delta);

            renderer.render(scene, camera);
            prevTime = time;
        }
    </script>
</body>
</html>
